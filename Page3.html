<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inder&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inder', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            width: 60%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #B276C2;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: black;
            border-radius: 10px 10px 0 0;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .dropdowns {
            display: flex;
            gap: 10px;
        }
        .dropdowns select {
            flex: 1;
        }
        .history {
            background: #ddd;
            height: 60px;
        }
        .button-container {
            text-align: center;
        }
        button {
            background-color: #D2A679;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Book Appointment</div>
        
        <label for="name">Name:</label>
        <input type="text" id="name">
        
        <label for="age">Age:</label>
        <input type="number" id="age">
        
        <label for="sex">Sex:</label>
        <select id="sex">
            <option>Male</option>
            <option>Female</option>
            <option>Non-Binary</option>
        </select>
        
        <label for="department">Department type:</label>
        <select id="department">
            <option>Cardiology</option>
            <option>Urology</option>
            <option>Pulmonology</option>
          <option>Neurology</option>
          <option>Phycology</option>
          <option>Vascology</option>
        </select>
        
        <label for="problem">Describe your problem here:</label>
        <textarea id="problem"></textarea>
        
        <label for="history">History of past medication/diseases:</label>
        <textarea id="history" class="history"></textarea>
        
        <label>Date of Booking:</label>
        <div class="dropdowns">
            <select>
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
            <select>
                <option>January</option>
                <option>February</option>
                <option>March</option>
            </select>
            <select>
                <option>2024</option>
                <option>2025</option>
            </select>
        </div>
        
        <div class="button-container">
            <button>Book & Pay</button>
        </div>
    </div>
</body>
</html>
